<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102820"><title>Cyacloud · Downloads</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17251f;background:#f2f5f0}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{background:#102820;color:#f3f7f2;padding:28px max(24px,calc((100vw - 920px)/2))}.brand{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#9bd8b0;font-weight:750}h1{margin:32px 0 8px;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.04em}header p{margin:0;color:#cad8ce}main{max-width:920px;margin:40px auto;padding:0 24px}.panel{background:white;border:1px solid #dce5dc;border-radius:18px;overflow:hidden;box-shadow:0 12px 32px #1028200a}.panel-head{padding:22px 24px;border-bottom:1px solid #e6ece6;display:flex;justify-content:space-between;gap:16px;align-items:center}h2{margin:0;font-size:1.1rem}#status{margin:0;color:#65756b;font-size:.9rem}#files{list-style:none;padding:0;margin:0}.file{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 24px;border-bottom:1px solid #edf1ed}.file:last-child{border-bottom:0}.file-name{font-weight:650;overflow-wrap:anywhere}.file-size{color:#718076;font-size:.85rem;margin-top:4px}.download{flex:0 0 auto;color:white;background:#176b43;border-radius:10px;padding:10px 16px;text-decoration:none;font-weight:700}.download:hover{background:#105637}.empty{padding:32px 24px;color:#65756b}footer{max-width:920px;margin:0 auto;padding:0 24px 32px;color:#718076;font-size:.85rem}footer a{color:#176b43}@media(max-width:560px){.panel-head{align-items:flex-start;flex-direction:column}.file{align-items:flex-start}}
</style></head><body>
<header><div class="brand">☁ Cyacloud</div><h1>Arquivos para baixar</h1><p>Escolha um arquivo e baixe uma cópia.</p></header>
<main><section class="panel" aria-labelledby="files-title"><div class="panel-head"><h2 id="files-title">Arquivos disponíveis</h2><p id="status" aria-live="polite">Carregando…</p></div><ul id="files"></ul><p id="empty" class="empty" hidden></p></section></main>
<footer>Downloads públicos hospedados no GitHub Pages.</footer>
<script>
const API="https://api.github.com/repos/phgs-oficial/cyacloud-downloads/contents/cyacloud?ref=main";const list=document.querySelector("#files"),status=document.querySelector("#status"),empty=document.querySelector("#empty");const formatSize=bytes=>bytes<1024?bytes+" B":bytes<1048576?(bytes/1024).toFixed(1)+" KB":(bytes/1048576).toFixed(1)+" MB";
fetch(API,{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("empty");return response.json()}).then(entries=>{const files=entries.filter(entry=>entry.type==="file"&&entry.name!==".gitkeep").sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));status.textContent=files.length+" "+(files.length===1?"arquivo":"arquivos");if(!files.length){empty.hidden=false;empty.textContent="Nenhum arquivo disponível no momento.";return}for(const file of files){const row=document.createElement("li");row.className="file";const details=document.createElement("div"),name=document.createElement("div"),size=document.createElement("div"),link=document.createElement("a");name.className="file-name";name.textContent=file.name;size.className="file-size";size.textContent=formatSize(file.size);details.append(name,size);link.className="download";link.textContent="Baixar";link.href=file.download_url;link.setAttribute("aria-label","Baixar "+file.name);row.append(details,link);list.append(row)}}).catch(()=>{status.textContent="Pronto para receber arquivos";empty.hidden=false;empty.textContent="Nenhum arquivo disponível no momento."});
</script></body></html>
